# Parameters for the ECB Survey of Professional Forecasters source.
#
# The ECB ships every survey round as one CSV inside a single ZIP. Each round
# becomes several silver rows — one per (variable, target quarter) — carrying
# an array of the anonymised forecasters' point forecasts.
#
# Verified reachable 2026-09-20: HTTP 200, content-type application/zip,
# last-modified 2026-07-23, 111 rounds from 1999Q1 to 2026Q3.
# Landing page, if this ever moves:
# https://www.ecb.europa.eu/stats/ecb_surveys/survey_of_professional_forecasters/html/index.en.html

download_url: "https://www.ecb.europa.eu/stats/prices/indic/forecast/shared/files/SPF_individual_forecasts.zip"

# Known keys: HICP (headline inflation), CORE (core inflation),
# RGDP (real GDP growth), UNEM (unemployment rate). Unknown keys are logged
# and skipped rather than failing the run.
variables:    ["HICP", "RGDP", "UNEM"]

min_year:     2020

# Horizon = quarters from the survey round to the target quarter, so 0 is a
# nowcast of the round's own quarter.
#
# NOTE: the ECB runs two rolling horizons per round, and where they land
# depends on the variable's reporting frequency — RGDP's sit at 2 and 6
# quarters, but HICP's, CORE's and UNEM's sit at 3 and *7*. A cutoff of 6
# therefore keeps only the near horizon for everything except RGDP:
#
#     max_horizon: 6  ->  108 rows / 4,659 guesses   (2020+, HICP+RGDP+UNEM)
#     max_horizon: 8  ->  162 rows / 6,576 guesses   (adds every far horizon)
#
# Raise this to 8 to pick up the full rolling panel.
max_horizon:  6
