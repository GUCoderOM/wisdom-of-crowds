# Databricks Asset Bundle for the wisdom-of-crowds data pipeline.
#
# One job, one task, one payload. Every run is identified by
# ``transformation_name`` inside the ``transformation_payload`` parameter.
# The registered transformations live in
# ``src/wisdom_of_crowds/transformations/`` and are dispatched by the
# framework at run time.

bundle:
  name: wisdom-of-crowds

variables:
  wheel_path:
    description: >
      Workspace path of the uploaded wheel. The task pip-installs this
      in-notebook, then dispatches on the transformation_payload.
    default:     ${workspace.artifact_path}/.internal/wisdom_of_crowds-0.4.0-py3-none-any.whl
  default_transformation_payload:
    description: >
      JSON string. The default triggers an ingest of the SPF source into
      the standard tables — override via `--params transformation_payload=...`
      at run time.
    default: |
      {"transformation_name":"ingest_spf","inputs":{},"outputs":{"guesses":"wisdom_of_crowds.core.guesses","sources":"wisdom_of_crowds.core.sources"},"params":{}}

targets:
  dev:
    default: true
    mode:    development
    workspace:
      host: https://dbc-bd84c712-176d.cloud.databricks.com

artifacts:
  wisdom_of_crowds:
    type:  whl
    path:  .
    build: uv build --wheel

resources:
  jobs:
    wisdom_of_crowds_pipeline:
      name: wisdom_of_crowds_pipeline
      description: >
        Wisdom-of-crowds data pipeline. One parameterised task; the
        transformation_payload JSON parameter picks the named
        transformation and its input/output table refs. Every ingestion
        and aggregation run for every data source lives under this job,
        keyed on transformation_name.
      tags:
        project:   wisdom-of-crowds
        component: pipeline

      parameters:
        - name:    transformation_payload
          default: ${var.default_transformation_payload}

      tasks:
        - task_key: run_transformation
          notebook_task:
            notebook_path: ./databricks_tasks/wisdom_of_crowds_task.py
            base_parameters:
              transformation_payload: "{{job.parameters.transformation_payload}}"
              wheel_path:             ${var.wheel_path}
