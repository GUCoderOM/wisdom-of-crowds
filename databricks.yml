# Databricks Asset Bundle for the wisdom-of-crowds data pipeline.
#
# Everest/DAB style: one job, one parameterised task. Run parameters
# choose which transformation runs (`phase = ingest | aggregate |
# end_to_end`) and against which source (`source_slug`). Parallel agents
# can trigger their own runs with different parameter combinations without
# stepping on each other, thanks to composite (cycle_dt, source_id)
# partitioning on the silver + gold Delta tables.
#
# Every ingestion and every aggregation for every data source lives under
# the single ``wisdom_of_crowds_pipeline`` job — the whole run history for
# this project is queryable from one place.

bundle:
  name: wisdom-of-crowds

variables:
  catalog:
    description: Unity catalog for all wisdom-of-crowds tables.
    default:     wisdom_of_crowds
  schema:
    description: Schema within the catalog holding wisdom-of-crowds tables.
    default:     core
  silver_table:
    description: Fully-qualified silver Delta table.
    default:     ${var.catalog}.${var.schema}.silver
  gold_table:
    description: Fully-qualified gold Delta table.
    default:     ${var.catalog}.${var.schema}.gold
  sources_table:
    description: Fully-qualified source dimension table.
    default:     ${var.catalog}.${var.schema}.sources
  default_phase:
    description: Which transformation phase runs by default.
    default:     end_to_end
  default_source_slug:
    description: Which source the pipeline pulls by default.
    default:     spf
  wheel_path:
    description: >
      Workspace path of the uploaded wheel. The task pip-installs this
      in-notebook; a non-empty serverless `dependencies` list restarts the
      Python REPL underneath a running notebook.
    default:     ${workspace.artifact_path}/.internal/wisdom_of_crowds-0.3.0-py3-none-any.whl

targets:
  dev:
    default: true
    mode:    development
    workspace:
      host: https://dbc-bd84c712-176d.cloud.databricks.com

artifacts:
  wisdom_of_crowds:
    type:  whl
    path:  .
    build: uv build --wheel

resources:
  jobs:
    wisdom_of_crowds_pipeline:
      name: wisdom_of_crowds_pipeline
      description: >
        Wisdom-of-crowds data pipeline. One parameterised task; run
        parameters pick the phase (ingest / aggregate / end_to_end) and
        source. Every ingestion + aggregation run for every data source
        lives under this one job. Add a new source by dropping a Source
        subclass in src/wisdom_of_crowds/ingest/sources/ and a YAML config
        in config/sources/, then triggering a run with source_slug=<slug>.
      tags:
        project: wisdom-of-crowds
        component: pipeline

      parameters:
        - name:    phase
          default: ${var.default_phase}
        - name:    source_slug
          default: ${var.default_source_slug}
        - name:    silver_table
          default: ${var.silver_table}
        - name:    gold_table
          default: ${var.gold_table}
        - name:    sources_table
          default: ${var.sources_table}

      tasks:
        - task_key: run_pipeline
          notebook_task:
            notebook_path: ./databricks_tasks/wisdom_of_crowds_task.py
            base_parameters:
              phase:         "{{job.parameters.phase}}"
              source_slug:   "{{job.parameters.source_slug}}"
              silver_table:  "{{job.parameters.silver_table}}"
              gold_table:    "{{job.parameters.gold_table}}"
              sources_table: "{{job.parameters.sources_table}}"
              wheel_path:    ${var.wheel_path}
